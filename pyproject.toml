[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "publicmail-scraper"
version = "1.0.0"
description = "Resumable, robots-aware collection of email addresses published on a supplied list of websites"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.12.14,<4",
  "beautifulsoup4>=4.13,<5",
  "defusedxml>=0.7.1,<1",
  "protego>=0.7,<1",
  "fastapi>=0.115.12,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "tldextract>=5.3,<6",
  "pypdf>=6.1,<7",
  "filelock>=3.18,<4",
]

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]
dev = [
  "pytest>=8.3,<10", "pytest-asyncio>=1.0,<2",
  "httpx>=0.28,<1", "ruff>=0.11,<1", "pytest-cov>=6,<8",
]

[project.scripts]
publicmail = "publicmail.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
publicmail = ["static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
