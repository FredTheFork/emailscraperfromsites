services:
  app:
    build:
      context: .
      args:
        WITH_BROWSER: "false"
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    ports:
      # Private by default: connect with an SSH tunnel, or use the TLS proxy below.
      - "${SCRAPER_BIND:-127.0.0.1}:${SCRAPER_PORT:-8000}:8000"
    environment:
      SCRAPER_DB: /data/harvest.db
      SCRAPER_TOKEN: ${SCRAPER_TOKEN:-}
      # App port is private; Caddy is the trusted external entrypoint if enabled.
      FORWARDED_ALLOW_IPS: "*"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - scraper_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SCRAPER_HOSTNAME: ${SCRAPER_HOSTNAME:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  scraper_data:
  caddy_data:
  caddy_config:
